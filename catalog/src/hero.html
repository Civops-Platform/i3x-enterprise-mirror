<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>.mono, .mono text { font-family: "IBM Plex Mono"; white-space: pre; } .sans { font-family: "IBM Plex Sans"; }</style></head>
<body>
<div class="left">
  <img class="logo" src="logo-dark.svg" alt="CivOps">
  <div class="kicker">OPEN SOURCE · i3X ENTERPRISE MIRROR</div>
  <h1>Every site,<br><span>one i3X view</span></h1>
  <div class="tag">Mirror any i3X server over the plain client contract, with values that admit it when a site's link drops.</div>
  <div class="chips">
    <span class="chip on">Any i3X 1.0 server</span>
    <span class="chip">Same element ids</span>
    <span class="chip">Priority replay</span>
    <span class="chip">MIT</span>
  </div>
</div>
<svg class="art" viewBox="0 0 820 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#2563eb" stop-opacity=".45"/><stop offset="100%" stop-color="#2563eb" stop-opacity="0"/></radialGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#93c5fd"/></marker>
  </defs>
  <circle cx="420" cy="360" r="330" fill="url(#glow)"/>

  <!-- enterprise -->
  <g transform="translate(230 60)">
    <rect width="360" height="190" rx="18" fill="#131e33" stroke="#3b82f6" stroke-width="3"/>
    <text x="180" y="38" text-anchor="middle" class="sans" font-weight="700" font-size="22" fill="#f1f5f9">Enterprise view</text>
    <g class="mono" font-size="15">
      <text x="22" y="82" fill="#a5b4c8">east/tank-3/level  <tspan fill="#f1f5f9">62.1</tspan></text>
      <text x="22" y="114" fill="#a5b4c8">west/oven-1/temp   <tspan fill="#f1f5f9">231</tspan></text>
      <text x="22" y="146" fill="#a5b4c8">south/line-2/rate  <tspan fill="#f1f5f9">412</tspan></text>
    </g>
    <g class="mono" font-size="12">
      <rect x="264" y="66" width="78" height="22" rx="11" fill="#22c55e" fill-opacity=".18" stroke="#22c55e"/><text x="303" y="82" text-anchor="middle" fill="#22c55e">Good</text>
      <rect x="264" y="98" width="78" height="22" rx="11" fill="#f59e0b" fill-opacity=".18" stroke="#f59e0b"/><text x="303" y="114" text-anchor="middle" fill="#f59e0b">Uncertain</text>
      <rect x="264" y="130" width="78" height="22" rx="11" fill="#22c55e" fill-opacity=".18" stroke="#22c55e"/><text x="303" y="146" text-anchor="middle" fill="#22c55e">Good</text>
    </g>
  </g>

  <!-- links -->
  <path d="M170 470 C 170 360, 300 330, 330 258" stroke="#93c5fd" stroke-width="3" fill="none" marker-end="url(#arr)"/>
  <path d="M410 470 C 410 400, 410 320, 410 258" stroke="#f59e0b" stroke-width="3" fill="none" stroke-dasharray="10 9"/>
  <g transform="translate(410 360)"><circle r="16" fill="#0f172a" stroke="#f59e0b" stroke-width="3"/><path d="M-6 -6 L6 6 M6 -6 L-6 6" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/></g>
  <path d="M650 470 C 650 360, 520 330, 490 258" stroke="#93c5fd" stroke-width="3" fill="none" marker-end="url(#arr)"/>
  <text x="250" y="330" text-anchor="end" class="mono" font-size="13" fill="#a5b4c8">subscribe · SSE</text>
  <text x="440" y="366" class="mono" font-size="13" fill="#f59e0b">link down</text>

  <!-- sites -->
  <g class="sans" font-weight="600" font-size="20" fill="#f1f5f9">
    <g transform="translate(80 478)"><rect width="180" height="92" rx="14" fill="#172338" stroke="#334a6e"/><text x="90" y="40" text-anchor="middle">East site</text><text x="90" y="68" text-anchor="middle" class="mono" font-weight="400" font-size="12" fill="#a5b4c8">i3X server · vendor A</text></g>
    <g transform="translate(320 478)"><rect width="180" height="92" rx="14" fill="#172338" stroke="#f59e0b"/><text x="90" y="40" text-anchor="middle">West site</text><text x="90" y="68" text-anchor="middle" class="mono" font-weight="400" font-size="12" fill="#a5b4c8">i3X server · vendor B</text></g>
    <g transform="translate(560 478)"><rect width="180" height="92" rx="14" fill="#172338" stroke="#334a6e"/><text x="90" y="40" text-anchor="middle">South site</text><text x="90" y="68" text-anchor="middle" class="mono" font-weight="400" font-size="12" fill="#a5b4c8">i3X server · vendor C</text></g>
  </g>

  <!-- replay order -->
  <text x="410" y="638" text-anchor="middle" class="mono" font-size="15" fill="#6b7d96">on reconnect, the gap replays in this order</text>
  <g class="mono" font-size="15" text-anchor="middle">
    <g transform="translate(108 660)"><rect width="140" height="44" rx="22" fill="#ef4444" fill-opacity=".14" stroke="#ef4444"/><text x="70" y="28" fill="#f1f5f9">P0 alarms</text></g>
    <g transform="translate(262 660)"><rect width="140" height="44" rx="22" fill="#2563eb" fill-opacity=".18" stroke="#3b82f6"/><text x="70" y="28" fill="#f1f5f9">P2 records</text></g>
    <g transform="translate(416 660)"><rect width="140" height="44" rx="22" fill="#2563eb" fill-opacity=".18" stroke="#3b82f6"/><text x="70" y="28" fill="#f1f5f9">P1 current</text></g>
    <g transform="translate(570 660)"><rect width="140" height="44" rx="22" fill="none" stroke="#334a6e"/><text x="70" y="28" fill="#a5b4c8">P3 history</text></g>
  </g>
  <g stroke="#6b7d96" stroke-width="2"><path d="M250 682 L 260 682"/><path d="M404 682 L 414 682"/><path d="M558 682 L 568 682"/></g>
</svg>
<div class="foot">CivOps · civops.io · MIT licensed · synthetic example data</div>
</body></html>
